services:
- type: web
  name: reachinbox-backend
    runtime: node
      plan: free
        buildCommand: npm install && npx prisma generate && npm run build
          startCommand: npx prisma migrate deploy && npm start
            envVars:
              - key: PORT
                  value: "10000"
                    - key: NODE_ENV
                        value: production
                          - key: DATABASE_URL
                              fromDatabase:
                                    name: reachinbox-postgres
                                          property: connectionString
                                            - key: REDIS_URL
                                                fromService:
                                                      type: redis
                                                            name: reachinbox-redis
                                                                  property: connectionString
                                                                    - key: JWT_SECRET
                                                                        generateValue: true

                                                                        - type: worker
                                                                          name: reachinbox-worker
                                                                            runtime: node
                                                                              plan: free
                                                                                buildCommand: npm install && npx prisma generate && npm run build
                                                                                  startCommand: node dist/workers/emailWorker.js
                                                                                    envVars:
                                                                                      - key: DATABASE_URL
                                                                                          fromDatabase:
                                                                                                name: reachinbox-postgres
                                                                                                      property: connectionString
                                                                                                        - key: REDIS_URL
                                                                                                            fromService:
                                                                                                                  type: redis
                                                                                                                        name: reachinbox-redis
                                                                                                                              property: connectionString
                                                                                                                                - key: JWT_SECRET
                                                                                                                                    fromService:
                                                                                                                                          type: web
                                                                                                                                                name: reachinbox-backend
                                                                                                                                                      property: JWT_SECRET
                                                                                                                                                      
                                                                                                                                                      - type: redis
                                                                                                                                                        name: reachinbox-redis
                                                                                                                                                          plan: free
                                                                                                                                                          
                                                                                                                                                          databases:
                                                                                                                                                          - name: reachinbox-postgres
                                                                                                                                                            databaseName: reachinbox
                                                                                                                                                              user: reachinbox
                                                                                                                                                                plan: free

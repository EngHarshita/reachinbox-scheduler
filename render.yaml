services:
  - type: web
    name: reachinbox-api
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://reachinbox-scheduler.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromKeyValue:
          name: reachinbox-redis
          property: connectionString
      - key: JWT_SECRET
        value: reachinbox_secret_jwt_key_2026
      - key: START_IN_PROCESS_WORKER
        value: "false"

  - type: worker
    name: reachinbox-worker
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromKeyValue:
          name: reachinbox-redis
          property: connectionString
      - key: JWT_SECRET
        value: reachinbox_secret_jwt_key_2026

databases:
  - name: reachinbox-postgres
    databaseName: reachinbox
    user: reachinbox_user
    plan: free

keyvalues:
  - name: reachinbox-redis
    plan: free
    ipAllowList: []
